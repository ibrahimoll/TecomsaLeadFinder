# Production stack for a TECOMSA-controlled server.
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# - The database is NOT published on any host port. Administrators connect via
#   SSH tunnel / VPN (see docs/OPERATIONS.md).
# - Place a TLS-terminating reverse proxy (nginx, Caddy, Traefik, cloud LB) in front
#   of the frontend on port 3000. Set COOKIE_SECURE=true and ENVIRONMENT=production.
# - Scheduled database backups are written to ./backups on the host.

name: leadfinder

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # The application's own non-superuser role (created on first start by init-prod/01-app-role.sh).
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Never the superuser: the app role owns only the LeadFinder database.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Background jobs run in the `worker` service, never in the API process.
      DISCOVERY_WORKER_ENABLED: "false"
    volumes:
      # Uploaded Odoo export files (import source audit trail; not the live datastore)
      - imports:/app/storage/imports
      # Cached discovery source extracts (Overture per release, OpenStreetMap per day)
      - discovery:/app/storage/discovery
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Background job worker (Find Leads discovery, company enrichment) on the Postgres job queue.
  # Starts after the API is healthy, i.e. after its migrations ran.
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    command: ["python", "-m", "app.services.jobs"]
    volumes:
      - discovery:/app/storage/discovery
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    ports:
      # Bind to localhost; expose publicly only through the TLS reverse proxy.
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  imports:
  discovery:

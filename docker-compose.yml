# Local development stack: PostgreSQL + FastAPI (auto-reload) + Next.js (hot reload).
# Usage:  cp .env.example .env  &&  docker compose up --build
# All ports are bound to 127.0.0.1 so nothing is exposed to the network.

name: leadfinder-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadfinder}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leadfinder}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@db:5432/leadfinder_test
      ENVIRONMENT: development
      # Discovery jobs run in the `worker` service, never in the API process.
      DISCOVERY_WORKER_ENABLED: "false"
      SEARXNG_URL: http://searxng:8080
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Background job worker (Find Leads discovery, website checks) on the Postgres job queue; restarts on code
  # changes like the API. Scale with: docker compose up -d --scale worker=2
  worker:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leadfinder}
      ENVIRONMENT: development
      SEARXNG_URL: http://searxng:8080
    command: watchfiles --filter python "python -m app.services.jobs" app
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # Local language model for the Profiler agent (company briefs/descriptions). Nothing leaves this machine.
  # Model: OLLAMA_MODEL (default qwen2.5:3b, ~2 GB, fits a 4 GB GPU). Pulled once into the volume.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Web search for Find Leads' direct company search (Google / Bing / DuckDuckGo... via SearXNG). Internal only:
  # the backend calls http://searxng:8080; LangSearch is the backup when it is blocked or finds nothing.
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-leadfinder-local-searxng}
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama:

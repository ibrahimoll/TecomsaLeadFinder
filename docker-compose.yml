# Local development stack: PostgreSQL + FastAPI (auto-reload) + Next.js (hot reload).
# Usage:  cp .env.example .env  &&  docker compose up --build
# All ports are bound to 127.0.0.1 so nothing is exposed to the network.

name: leadfinder-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-leadfinder}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leadfinder}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@db:5432/leadfinder_test
      ENVIRONMENT: development
      # Discovery jobs run in the `worker` service, never in the API process.
      DISCOVERY_WORKER_ENABLED: "false"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Background job worker (Find Leads discovery, website checks) on the Postgres job queue; restarts on code
  # changes like the API. Scale with: docker compose up -d --scale worker=2
  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leadfinder}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-leadfinder}
      ENVIRONMENT: development
    command: watchfiles --filter python "python -m app.services.jobs" app
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
